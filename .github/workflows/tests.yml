name: tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 18 * * *" # 02:17 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Commit lane (static gates + tests, no slow/IO suites)
        run: python tools/check.py --lane commit

  full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Full lane + coverage
        run: python tools/check.py --lane full --coverage
      - name: Coverage floor
        # 审计 A-27：full 车道已默认强制阈值；这里额外校验"棘轮"基线
        # （tools/coverage_baseline.json，只升不降，低于基线 0.3 个百分点即失败）。
        run: python tools/check.py --lane full --coverage
