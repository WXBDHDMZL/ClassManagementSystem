name: class_management_system
description: "班级管理系统：面向班主任的记录、考勤与统计工具。"
publish_to: 'none'

version: 5.0.0+185
environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.3
  excel: ^4.0.6
  archive: ^3.6.1
  xml: ^6.6.1
  file_picker: ^8.1.2
  provider: ^6.1.2
  crypto: ^3.0.6
  fl_chart: ^1.2.0
  window_manager: ^0.5.2
  tray_manager: ^0.5.3
  screen_retriever: ^0.2.2
  ffi: ^2.1.0
  win32: ^5.15.0
  cryptography: ^2.9.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - LICENSE.txt
    - assets/icons/tray.ico
    - assets/icons/ball.png
